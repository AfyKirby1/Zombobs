<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <!-- Meta tags for SEO and atmosphere -->
    <meta name="description" content="ZOMBOBS - Zombie Apocalypse with Friends - Top-down survival shooter">
    <meta name="theme-color" content="#ff1744">
    <meta name="color-scheme" content="dark">
    <meta name="format-detection" content="telephone=no">
    <meta property="og:type" content="website">
    <meta property="og:title" content="ZOMBOBS - Zombie Apocalypse with Friends">
    <meta property="og:description" content="Top-down zombie survival shooter. Solo, co-op, and multiplayer.">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="ZOMBOBS - Zombie Apocalypse with Friends">
    <meta name="twitter:description" content="Top-down zombie survival shooter. Solo, co-op, and multiplayer.">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>ZOMBOBS - ZOMBIE APOCALYPSE WITH FRIENDS</title>
    <link rel="icon" type="image/x-icon" href="assets/icons/favicon.ico">
    <link rel="apple-touch-icon" href="assets/icons/favicon.png">
    <link rel="preload" href="assets/fonts/roboto-mono-latin-400.woff2" as="font"
        type="font/woff2" crossorigin>
    <link rel="stylesheet" href="css/fonts.css">
    <!-- Relative paths for robust Itch.io and CDN path resolution -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/ui-overlay.css">
    <style>
        /* Critical boot overlay — visible before style.css loads */
        .boot-overlay {
            position: fixed;
            inset: 0;
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a0a0a;
            color: #e8e8e8;
        }

        .boot-overlay__inner {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            font-family: 'Roboto Mono', monospace;
        }

        .boot-overlay__title {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 0.18em;
            color: #ff1744;
        }

        .boot-overlay__label {
            font-size: 12px;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.72);
        }

        .boot-overlay__badge {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.24em;
            text-transform: uppercase;
            padding: 5px 12px;
            border: 1px solid rgba(56, 189, 248, 0.5);
            border-radius: 999px;
            color: #7dd3fc;
            background: rgba(14, 165, 233, 0.1);
            box-shadow: 0 0 16px rgba(56, 189, 248, 0.18);
        }

        .boot-overlay__sub {
            font-size: 10px;
            letter-spacing: 0.08em;
            text-transform: none;
            color: rgba(125, 211, 252, 0.72);
            max-width: min(92vw, 360px);
            text-align: center;
            line-height: 1.45;
        }

        .boot-overlay--webgpu .boot-overlay__spinner {
            border-top-color: #38bdf8;
        }

        .boot-overlay__spinner {
            width: 36px;
            height: 36px;
            border: 3px solid rgba(255, 255, 255, 0.12);
            border-top-color: #ff1744;
            border-radius: 50%;
            animation: boot-spin 0.75s linear infinite;
        }

        @keyframes boot-spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
    <script>
        // Suppress console warnings from Itch.io iframe Permissions Policy
        (function () {
            const originalWarn = console.warn;
            console.warn = function (...args) {
                const message = args.join(' ');
                // Suppress Permissions Policy warnings from Itch.io iframe
                if (message.includes('Unrecognized feature') ||
                    message.includes('monetization') ||
                    message.includes('xr-spatial-tracking') ||
                    message.includes('Permissions-Policy') ||
                    message.includes('allowfullscreen') ||
                    message.includes('downloadable font:')) {
                    return; // Silently ignore
                }
                originalWarn.apply(console, args);
            };
        })();
    </script>
</head>

<body>
    <div id="boot-overlay" class="boot-overlay" role="status" aria-live="polite" aria-busy="true">
        <div class="boot-overlay__inner">
            <span class="boot-overlay__title">ZOMBOBS</span>
            <span class="boot-overlay__badge" hidden>WebGPU</span>
            <span class="boot-overlay__spinner" aria-hidden="true"></span>
            <span class="boot-overlay__label">Loading game</span>
            <span class="boot-overlay__sub" hidden></span>
        </div>
    </div>
    <noscript>
        <div class="noscript-notice">
            ZOMBOBS needs JavaScript. Enable scripts in your browser to play.
        </div>
    </noscript>
    <div id="gameContainer">
        <canvas id="gpuCanvas"></canvas>
        <canvas id="gameCanvas"></canvas>
    </div>
    <canvas id="uiCanvas"></canvas>

    <!-- Use clean relative path for module entry point without crossorigin -->
    <script type="module" src="js/main.js"></script>
</body>

</html>
